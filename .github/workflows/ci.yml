name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libbpf-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked --no-default-features
      - name: no comments in sources
        run: "! grep -rnE '(^|[^:\"/])//|/\\*' crates --include='*.rs' --include='*.c' | grep -v 'https\\?://'"

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libbpf-dev pkg-config util-linux
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: privileged tests (eBPF, kcore, tracefs)
        run: cargo test --workspace --locked -- --ignored
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
      - name: capability probe
        run: |
          ./target/debug/vantage kernguard caps
          sudo ./target/debug/vantage kernguard caps
      - name: full scan as root
        run: sudo ./target/debug/vantage --json --output scan.json scan && sudo cat scan.json | head -c 4000
      - run: cargo bench --workspace --locked

  no-ebpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked --no-default-features
      - run: "! ./target/debug/vantage kernguard monitor --duration 1"

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libbpf-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets --locked
